<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EEF6FF">
  <title>Saving to ShareShuffle...</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EEF6FF;color:#14304a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;text-align:center;}
    .card{max-width:420px;background:white;border:1px solid rgba(20,48,74,.12);border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(20,48,74,.12)}
    h1{font-size:1.6rem;margin:.2rem 0 .4rem}p{margin:.35rem 0;color:#4b647a;line-height:1.45}
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening ShareShuffle...</h1>
    <p>We caught the shared link. If nothing happens, open the app and paste the link.</p>
  </div>
  <script>
    const incoming = new URLSearchParams(location.search);
    const title = incoming.get("title") || "";
    const text = incoming.get("text") || "";
    const url = incoming.get("url") || "";
    const params = new URLSearchParams();
    if (title) params.set("title", title);
    if (text) params.set("text", text);
    if (url) params.set("url", url);
    params.set("source", "share-target");
    location.replace(`/app/?${params.toString()}`);
  </script>
</body>
</html>
