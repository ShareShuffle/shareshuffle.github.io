<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opening ShareShuffle…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#EEF6FF">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon180-square.png">
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#EEF6FF;color:#162033;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;text-align:center}
    .card{background:white;border:1px solid rgba(13,110,253,.14);border-radius:28px;padding:28px;max-width:420px;box-shadow:0 22px 70px rgba(13,30,55,.16)}
    h1{font-size:1.5rem;margin:0 0 8px;letter-spacing:-.03em}.muted{color:#64748b;line-height:1.4}.btn{display:inline-flex;margin-top:16px;background:linear-gradient(135deg,#0d6efd,#13c8ff);color:#fff;border-radius:999px;padding:12px 16px;text-decoration:none;font-weight:800}
  </style>
    <link href="/assets/ss-skeleton.css" rel="stylesheet">
</head>
<body>
  <main class="card">
    <h1>Opening ShareShuffle…</h1>
    <p class="muted">Your shared link is being moved into the mobile creator.</p>
    <a id="fallback" class="btn" href="/app/?source=share-target">Open ShareShuffle</a>
  </main>
  <script>
    (function () {
      const incoming = new URLSearchParams(location.search);
      const outgoing = new URLSearchParams();
      outgoing.set("source", "share-target");
      ["title", "text", "url"].forEach((key) => {
        const value = incoming.get(key);
        if (value) outgoing.set(key, value);
      });
      const href = `/app/?${outgoing.toString()}`;
      document.getElementById("fallback").href = href;
      location.replace(href);
    })();
  </script>
    <script src="/assets/ss-skeleton.js" defer></script>
</body>
</html>
