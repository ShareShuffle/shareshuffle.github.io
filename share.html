<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShareShuffle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-5">

          <div class="text-center mb-4">

<img
  id="productImage"
  src=""
  class="img-fluid rounded-4 mb-4"
  style="max-height:350px; display:none;"
  alt="Shared product image"
>
            <h1 id="title" class="display-6 fw-bold">
              Loading...
            </h1>

          </div>

          <div class="alert alert-light border">
            <p id="note" class="mb-0"></p>
          </div>

          <div class="d-grid gap-2">

            <a
              id="amazon"
              class="btn btn-primary btn-lg rounded-pill"
              target="_blank">
              View On Amazon
            </a>

          </div>

          <hr>

          <small class="text-muted">
            As an Amazon Associate I earn from qualifying purchases.
          </small>

        </div>

      </div>

    </div>
  </div>

</div>



  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-IdAGNybUmS4LPqQX-WrOVtIDPPl8ZzE",
      authDomain: "shareshuffle-c7f96.firebaseapp.com",
      projectId: "shareshuffle-c7f96",
      storageBucket: "shareshuffle-c7f96.firebasestorage.app",
      messagingSenderId: "507028011652",
      appId: "1:507028011652:web:97c161c63b7940af0f60d1",
      measurementId: "G-C8W9TBP705"
    };

    const AMAZON_TAG = "shareshuffle-20";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    function makeAmazonAffiliateUrl(originalUrl) {
      const url = new URL(originalUrl);
      url.searchParams.set("tag", AMAZON_TAG);
      return url.toString();
    }

    async function loadShare() {
      if (!id) {
        document.getElementById("title").innerText = "Missing share ID";
        return;
      }

      const snap = await getDoc(doc(db, "shares", id));

      if (!snap.exists()) {
        document.getElementById("title").innerText = "Share not found";
        return;
      }
      
const data = snap.data();

document.getElementById("title").innerText = data.title || "Shared find";
document.getElementById("note").innerText = data.note || "";

const productImage = document.getElementById("productImage");

if (data.image) {
  productImage.src = data.image;
  productImage.style.display = "block";
}

const amazonLink = document.getElementById("amazon");
amazonLink.href = makeAmazonAffiliateUrl(data.url);

    loadShare();
  </script>

</body>
</html>
