    <script>

    <script>
    const SHARE_BASE_URL = "https://shfl.me/";
    const params = new URLSearchParams(location.search);
    const handleSlug = String(params.get("u") || "").trim().replace(/^@+/, "").toLowerCase();
    const slug = String(params.get("s") || "").trim().toLowerCase();

    function escapeHtml(value = "") {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function smartTruncate(value = "", maxLength = 120) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      const slice = text.slice(0, Math.max(0, maxLength - 1));
      const lastSpace = slice.lastIndexOf(" ");
      const trimmed = lastSpace > 45 ? slice.slice(0, lastSpace) : slice;
      return trimmed.replace(/[\s,;:.-]+$/g, "") + "…";
    }

    function cleanProductTitle(title = "") {
      return String(title || "")
        .replace(/^Amazon(?:\.com)?\s*[:|｜\-–—]\s*/i, "")
        .replace(/^Walmart(?:\.com)?\s*[:|｜\-–—]\s*/i, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getShelfDataUrl() {
      const q = new URLSearchParams();
      if (handleSlug) q.set("u", handleSlug);
      if (slug) q.set("s", slug);
      q.set("v", "23");
      return `https://shareshuffle.com/shelfData?${q.toString()}`;
    }

    function buildResolvedShelfUrl(resolved = {}) {
      const h = String(resolved.handleSlug || handleSlug || "").toLowerCase();
      const s = String(resolved.shelfSlug || slug || "").toLowerCase();
      if (h && s) return `https://shareshuffle.com/shelf.html?u=${encodeURIComponent(h)}&s=${encodeURIComponent(s)}`;
      if (s) return `https://shareshuffle.com/shelf.html?s=${encodeURIComponent(s)}`;
      return window.location.href;
    }

    function productImageUrl(item) {
      return item?.id ? `https://shareshuffle.com/i-${encodeURIComponent(item.id)}` : "";
    }

    function sharePageUrl(item) {
      return item?.id ? `https://shareshuffle.com/share.html?id=${encodeURIComponent(item.id)}` : "#";
    }

    function normalizeDedupeText(value = "") {
      return String(value || "")
        .toLowerCase()
        .replace(/^amazon(?:\.com)?\s*[:|｜\-–—]\s*/i, "")
        .replace(/\b(?:amazon|walmart|target|best buy|ebay)(?:\.com)?\b/g, "")
        .replace(/\b(?:compressor|compression|pedal|guitar|bass|effect|effects|true bypass)\b/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim()
        .split(/\s+/)
        .slice(0, 8)
        .join(" ");
    }

    function dedupeShelfItems(items = []) {
      const seen = new Set();
      return items.filter((item) => {
        const titleKey = normalizeDedupeText(item.title || "");
        const urlKey = String(item.originalUrl || item.url || "").toLowerCase()
          .replace(/^https?:\/\//, "")
          .replace(/[?#].*$/, "")
          .replace(/\/$/, "");
        const imageKey = String(item.image || "").toLowerCase().split("?")[0];
        const key = titleKey || urlKey || imageKey || item.id;
        if (!key) return true;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function storeButtonLabel(item) {
      const merchant = String(item.merchant || "").trim();
      if (merchant && merchant !== "direct") return `View on ${merchant.charAt(0).toUpperCase()}${merchant.slice(1)}`;
      return "View Store";
    }

    function isHostedShareShuffleUrl(value = "") {
      try {
        const parsed = new URL(String(value || ""));
        const host = parsed.hostname.replace(/^www\./, "").toLowerCase();
        return host === "shareshuffle.com" ||
          host === "shfl.me" ||
          host === "shflz.com" ||
          host === "shelfmix.com" ||
          host.endsWith(".web.app") ||
          host.endsWith(".firebaseapp.com");
      } catch {
        return false;
      }
    }

    const AMAZON_ASSOCIATE_TAG = "shareshuffle-20";
    const WALMART_IMPACT_CONFIG = {
      publisherId: "1936697",
      campaignId: "565706",
      creativeId: "9383",
      sourceId: "imp_000011112222333344"
    };

    function hostnameOf(value = "") {
      try {
        return new URL(String(value || "")).hostname.replace(/^www\./, "").toLowerCase();
      } catch {
        return "";
      }
    }

    function isAmazonUrl(value = "") {
      const host = hostnameOf(value);
      return host === "amazon.com" ||
        host.endsWith(".amazon.com") ||
        host === "a.co" ||
        host === "amzn.to";
    }

    function isWalmartUrl(value = "") {
      const host = hostnameOf(value);
      return host === "walmart.com" || host.endsWith(".walmart.com");
    }

    function isWalmartImpactUrl(value = "") {
      const host = hostnameOf(value);
      return host === "goto.walmart.com" || host.endsWith(".impactradius.com");
    }

    function withAmazonAffiliateTag(value = "") {
      const raw = String(value || "").trim();
      if (!raw || !isAmazonUrl(raw)) return raw;
      try {
        const parsed = new URL(raw);
        if (!parsed.searchParams.has("tag")) {
          parsed.searchParams.set("tag", AMAZON_ASSOCIATE_TAG);
        }
        return parsed.toString();
      } catch {
        return raw;
      }
    }

    function withWalmartAffiliateLink(value = "") {
      const raw = String(value || "").trim();
      if (!raw || !isWalmartUrl(raw) || isWalmartImpactUrl(raw)) return raw;
      try {
        const destination = new URL(raw);
        const affiliate = new URL(`https://goto.walmart.com/c/${WALMART_IMPACT_CONFIG.publisherId}/${WALMART_IMPACT_CONFIG.campaignId}/${WALMART_IMPACT_CONFIG.creativeId}`);
        affiliate.searchParams.set("veh", "aff");
        affiliate.searchParams.set("sourceid", WALMART_IMPACT_CONFIG.sourceId);
        affiliate.searchParams.set("u", destination.toString());
        return affiliate.toString();
      } catch {
        return raw;
      }
    }

    function withAffiliateUrl(value = "") {
      const amazon = withAmazonAffiliateTag(value);
      if (amazon !== value) return amazon;
      return withWalmartAffiliateLink(value);
    }

    function chooseStoreUrl(item = {}) {
      const candidates = [item.storeUrl, item.originalUrl, item.productUrl, item.merchantUrl, item.url]
        .map((value) => String(value || "").trim())
        .filter(Boolean);
      const chosen = candidates.find((value) => /^https?:\/\//i.test(value) && !isHostedShareShuffleUrl(value)) || "";
      return withAffiliateUrl(chosen);
    }

    function cropVarsForItem(item = {}) {
      const text = `${item.title || ""} ${item.merchant || ""}`.toLowerCase();
      const id = String(item.id || "");
      let hash = 0;
      for (let i = 0; i < id.length; i += 1) hash = (hash * 31 + id.charCodeAt(i)) % 997;
      const x = 45 + (hash % 13);
      const y = text.includes("pedal") || text.includes("compressor") || text.includes("boost") ? 48 : 50;
      const scale = text.includes("cable") || text.includes("velcro") ? 1.0 : 1.04;
      return `--crop-x:${x}%;--crop-y:${y}%;--crop-scale:${scale};`;
    }

    function renderError(message, detail = "", debug = []) {
      const title = document.getElementById("shelfTitle");
      const status = document.getElementById("status");
      const items = document.getElementById("items");
      if (title) title.textContent = "Shelf did not load";
      if (status) status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error`;
      if (items) {
        items.innerHTML = `
          <div class="col-12">
            <div class="hero-card p-4">
              <h2 class="fw-bold">${escapeHtml(message)}</h2>
              ${detail ? `<p class="text-secondary">${escapeHtml(detail)}</p>` : ""}
              <pre class="small text-start bg-light border rounded-3 p-3 mb-0" style="white-space:pre-wrap;">${escapeHtml((debug || []).join("\n"))}</pre>
            </div>
          </div>
        `;
      }
    }

    function renderEmpty(payload) {
      const items = document.getElementById("items");
      const status = document.getElementById("status");
      if (status) status.innerHTML = `<i class="fa-solid fa-box-open"></i> 0 picks`;
      if (items) {
        items.innerHTML = `
          <div class="col-12">
            <div class="hero-card p-4">
              <h2 class="fw-bold">No items found for this shelf</h2>
              <p class="text-secondary mb-2">This route loaded, but no shares matched the shelf slug yet.</p>
              <pre class="small text-start bg-light border rounded-3 p-3 mb-0" style="white-space:pre-wrap;">${escapeHtml((payload.debug || []).join("\n"))}</pre>
            </div>
          </div>
        `;
      }
    }

    function renderItems(payload) {
      const items = document.getElementById("items");
      const docs = dedupeShelfItems(payload.items || []);
      items.innerHTML = "";

      docs.forEach((item) => {
        const shareUrl = sharePageUrl(item);
        const img = productImageUrl(item);
        const title = smartTruncate(cleanProductTitle(item.title || "Shared find"), 95);
        const note = smartTruncate(item.note || "Shared recommendation", 150);
        const storeUrl = chooseStoreUrl(item);
        const cropStyle = cropVarsForItem(item);

        const card = document.createElement("div");
        card.className = "shelf-grid-item col-md-6 col-xl-4";
        card.innerHTML = `
          <article class="card product-card product-card-clickable h-100" data-share-url="${escapeHtml(shareUrl)}">
            <div class="product-image-wrap" style="${escapeHtml(cropStyle)}">
              ${img ? `<img class="editorial-product-img" src="${escapeHtml(img)}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;missing-image-state&quot;><span><small>Product photo not added yet</small></span></div>'">` : `<div class="missing-image-state"><span><small>Product photo not added yet</small></span></div>`}
            </div>
            <div class="card-body d-flex flex-column">
              <h2 class="product-title">${escapeHtml(title)}</h2>
              <p class="product-note">${escapeHtml(note)}</p>
              <div class="product-actions mt-auto">
                <a class="btn btn-primary rounded-pill fw-bold" href="${escapeHtml(shareUrl)}">
                  <i class="fa-solid fa-up-right-from-square me-1"></i> Open
                </a>
                ${storeUrl ? `<a class="btn btn-outline-secondary rounded-pill fw-bold" href="${escapeHtml(storeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(storeButtonLabel(item))}</a>` : ""}
              </div>
            </div>
          </article>
        `;
        items.appendChild(card);
      });
    }

    async function loadShelf() {
      const title = document.getElementById("shelfTitle");
      const description = document.getElementById("shelfDescription");
      const status = document.getElementById("status");

      if (!slug) {
        renderError("Missing shelf slug", "Expected a URL like /shelf.html?s=bass-gear.");
        return;
      }

      status.innerHTML = `<i class="fa-solid fa-box-open"></i> Loading items…`;

      const response = await fetch(getShelfDataUrl(), { cache: "no-store" });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.ok) {
        renderError("Shelf data request failed", payload.error || `${response.status} ${response.statusText}`, payload.debug || []);
        return;
      }

      const resolved = payload.resolved || {};
      const shelfName = resolved.shelfName || slug.replace(/-/g, " ");
      const handleDisplay = resolved.handleDisplay || resolved.handleSlug || "";
      const rawCount = Number(payload.count || 0);
      const renderedCount = dedupeShelfItems(payload.items || []).length;
      const count = renderedCount || rawCount;

      title.textContent = handleDisplay ? `${shelfName} by ${handleDisplay}` : shelfName;
      description.textContent = count ? `${count} pick${count === 1 ? "" : "s"} shared with ShareShuffle.` : "A collection of recommendations shared with ShareShuffle.";
      document.title = `${title.textContent} — ShareShuffle`;
      status.innerHTML = `<i class="fa-solid fa-box-open"></i> ${count} pick${count === 1 ? "" : "s"}`;

      const copyShelf = document.getElementById("copyShelf");
      const cleanShelfUrl = buildResolvedShelfUrl(resolved);
      copyShelf.dataset.url = cleanShelfUrl;
      copyShelf.title = `Copy ${cleanShelfUrl}`;

      if (!count) {
        renderEmpty(payload);
        return;
      }

      renderItems(payload);
    }

    document.getElementById("copyShelf").addEventListener("click", async () => {
      const btn = document.getElementById("copyShelf");
      const url = btn.dataset.url || buildResolvedShelfUrl();
      await navigator.clipboard.writeText(url);
      btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Copied';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-link me-1"></i> Copy Shelf';
      }, 1600);
    });

    document.addEventListener("click", (event) => {
      const card = event.target.closest(".product-card.product-card-clickable");
      if (card && !event.target.closest("a, button, .share-actions")) {
        const shareUrl = card.dataset.shareUrl;
        if (shareUrl) window.location.href = shareUrl;
      }
    });

    loadShelf().catch((error) => {
      console.error(error);
      renderError("Could not load shelf", error.message || String(error), []);
    });
  </script>
</body>

</html>
