    <style>
        :root {
      --ss-orange:#ff7a18;
      --ss-gold:#ffc145;
      --ss-blue:#0d6efd;
      --ss-cyan:#13c8ff;
      --ss-navy:#071426;
      --ss-ink:#102033;
      --ss-muted:#6b7280;
      --ss-grad:linear-gradient(135deg,#ff7a18,#ffc145,#13c8ff,#0d6efd);
      --ss-grad-dark:
        radial-gradient(circle at 12% 12%,rgba(255,122,24,.42),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(19,200,255,.32),transparent 28%),
        radial-gradient(circle at 50% 100%,rgba(13,110,253,.35),transparent 35%),
        linear-gradient(135deg,#071426 0%,#102033 100%);
    }

    body {
      min-height:100vh;
      background:var(--ss-grad-dark);
      color:var(--ss-ink);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

.brand-logo {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 7px;
  background: #EEF6FF;
  border: 1px solid rgba(255,255,255,.44);
  box-shadow: 0 12px 30px rgba(13, 110, 253, 0.26);
}



    .hero-card {
      border-radius:34px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(255,255,255,.7);
      box-shadow:0 30px 90px rgba(0,0,0,.32);
      overflow:hidden;
    }

    .shelf-title {
      font-size:clamp(2rem,6vw,3.9rem);
      letter-spacing:-.035em;
      line-height:1;
      font-weight:800;
    }

    .product-card {
      border:0;
      border-radius:28px;
      overflow:hidden;
      height:100%;
      box-shadow:0 18px 50px rgba(0,0,0,.18);
    }

    .product-img-wrap {
      background:#f5f8ff;
      min-height:220px;
      display:grid;
      place-items:center;
      border-bottom:1px solid rgba(13,110,253,.08);
    }

    .product-img {
      width:100%;
      max-height:245px;
      object-fit:contain;
      padding:16px;
    }

    .fallback-icon {
      font-size:4rem;
      background:var(--ss-grad);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .btn-ss {
      border:0;
      color:white;
      font-weight:900;
      border-radius:999px;
      background:var(--ss-grad);
      box-shadow:0 14px 28px rgba(13,110,253,.22);
    }

    .small-muted {
      color:var(--ss-muted);
    }

    .shelf-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  margin-bottom: 14px;
  padding: 8px 13px;

  border-radius: 999px;
  background: rgba(13, 110, 253, 0.08);
  color: #0d6efd;

  font-size: 0.92rem;
  font-weight: 850;
}

.hero-card {
  position: relative;
}

.hero-card::after {
  content: "";
  position: absolute;
  right: -90px;
  bottom: -120px;

  width: 280px;
  height: 280px;

  border-radius: 999px;
  background: rgba(19, 200, 255, 0.16);
  filter: blur(2px);
}

.hero-card > * {
  position: relative;
  z-index: 1;
}

.product-card {
  transition:
    transform 180ms ease,
    box-shadow 180ms ease;
}

.product-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 26px 70px rgba(0, 0, 0, 0.24);
}

.product-title {
  font-size: 1.02rem;
  line-height: 1.22;
  letter-spacing: -0.015em;
  min-height: 3.7em;
}

.share-link-btn {
  border-radius: 999px;
  font-weight: 850;
}

.shelf-count-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border-radius: 999px;

  background: #f5f8ff;
  color: #102033;

  font-weight: 850;
}

.share-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid rgba(13,110,253,.12);
}

.share-action-btn {
  width: 42px;
  height: 42px;
  border-radius: 999px;
  display: inline-grid;
  place-items: center;
  border: 1px solid rgba(13,110,253,.18);
  background: #fff;
  color: #102033;
  text-decoration: none;
  font-size: 1rem;
}

.product-card .card-body { min-height: 350px; }
.product-card .small-muted { min-height: 3.2em; }

.share-action-btn:hover {
  transform: translateY(-1px);
  color: #0d6efd;
  box-shadow: 0 8px 20px rgba(13,110,253,.16);
}



/* ShareShuffle polish pass: readable headings, clamped card content, stronger action targets */
.brand-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.product-title,
.title,
.shelf-title { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.clamp-2,
.clamp-3,
.clamp-4 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.clamp-2 { -webkit-line-clamp: 2; }
.clamp-3 { -webkit-line-clamp: 3; }
.clamp-4 { -webkit-line-clamp: 4; }
.affiliate-disclosure {
  margin: 12px 0 0;
  color: #334155;
  font-size: .86rem;
  line-height: 1.35;
}
.share-action-btn { transition: transform 160ms ease, box-shadow 160ms ease, color 160ms ease; }
.share-action-btn:hover { transform: translateY(-1px) scale(1.08); }

  
/* ShareShuffle shared heading polish */
.shelf-title,
.title,
h1 {
  font-family: "League Spartan", Inter, system-ui, sans-serif;
  font-weight: 700 !important;
  letter-spacing: -0.035em !important;
}
.hero-card { border-radius: 28px; }
.product-title { max-height: 3.75em; }
.small-muted { max-height: 2.8em; overflow: hidden; }


    .product-card.product-card-clickable { cursor: pointer; }
    .product-card .product-img-wrap,
    .product-card .product-title,
    .product-card .product-note { cursor: pointer; }
    .missing-image-state { display:flex; align-items:center; justify-content:center; min-height:220px; background:linear-gradient(135deg,#eef6ff,#fff8e7); color:#64748b; text-align:center; padding:18px; font-weight:700; }
    .missing-image-state small { display:block; margin-top:6px; font-weight:600; }
</style>

<body>
    <main class="container py-4 py-lg-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <a href="/" class="d-flex align-items-center gap-2 text-decoration-none text-white">
                <div class="brand-logo">
                    <img src="/icons/icon32.png" alt="ShareShuffle"  />
                </div>
                <div>
                    <div class="fw-bold fs-5 lh-1">ShareShuffle</div>
                    <div class="small text-white-50">Share what’s worth finding</div>
                </div>
            </a>
            <button id="copyShelf" class="btn btn-light rounded-pill fw-bold">
                <i class="fa-solid fa-link me-1"></i> Copy Shelf
            </button>
        </div>
        <section class="hero-card p-4 p-lg-5 mb-4">
            <div class="row align-items-end g-4">
                <div class="col-lg-8">
                    <div class="shelf-eyebrow">
                        <i class="fa-solid fa-layer-group"></i>
                        ShelfMix Collection
                    </div>
                    <h1 id="shelfTitle" class="shelf-title mb-3">Loading shelf...</h1>
                    <p id="shelfDescription" class="lead text-secondary mb-0">
                        A collection of recommendations shared with ShareShuffle.
                    </p>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <div id="status" class="shelf-count-pill">

    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-IdAGNybUmS4LPqQX-WrOVtIDPPl8ZzE",
      authDomain: "shareshuffle-c7f96.firebaseapp.com",
      projectId: "shareshuffle-c7f96",
      storageBucket: "shareshuffle-c7f96.firebasestorage.app",
      messagingSenderId: "507028011652",
      appId: "1:507028011652:web:97c161c63b7940af0f60d1",
      measurementId: "G-C8W9TBP705"
    };

    const SHARE_BASE_URL = "https://shfl.me/";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const handleSlug = String(params.get("u") || "").trim().replace(/^@+/, "").toLowerCase();
    const slug = String(params.get("s") || "").trim().toLowerCase();
    let resolvedHandleSlug = handleSlug;
    let resolvedShelfSlug = slug;
    let resolvedShelfUrl = "";

    function buildResolvedShelfUrl() {
      if (resolvedHandleSlug && resolvedShelfSlug) return `https://shelfmix.com/${encodeURIComponent(resolvedHandleSlug)}/${encodeURIComponent(resolvedShelfSlug)}`;
      if (handleSlug && slug) return `https://shelfmix.com/${encodeURIComponent(handleSlug)}/${encodeURIComponent(slug)}`;
      if (slug) return `https://shareshuffle.com/shelf.html?s=${encodeURIComponent(slug)}`;
      return window.location.href;
    }

    function setShelfFailure(message, error = null) {
      const title = document.getElementById("shelfTitle");
      const status = document.getElementById("status");
      const items = document.getElementById("items");
      if (title) title.textContent = "Shelf did not load";
      if (status) status.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(message)}`;
      if (items) {
        items.innerHTML = `
          <div class="col-12">
            <div class="hero-card p-4">
              <h2 class="fw-bold">I hit a shelf loading error.</h2>
              <p class="text-secondary mb-2">Try the clean shelf URL, or refresh after the newest patch deploy finishes.</p>
              <p class="small-muted mb-0">${escapeHtml(error?.message || String(error || ""))}</p>
            </div>
          </div>
        `;
      }
    }

    function canonicalShelfPath() {
      if (!handleSlug || !slug) return "";
      return `/${encodeURIComponent(handleSlug)}/${encodeURIComponent(slug)}`;
    }

    if (/^(www\.)?shelfmix\.com$/i.test(location.hostname) && location.pathname.toLowerCase().endsWith("/shelf.html") && handleSlug && slug && canonicalShelfPath()) {
      history.replaceState(null, "", canonicalShelfPath());
    }



    function titleFromSlug(value) {
      return value
        .split("-")
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ") || "Shelf";
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function cleanProductTitle(value = "") {
      let title = String(value || "").trim();

      title = title
        .replace(/^(Amazon(?:\.com)?|Walmart(?:\.com)?|Target|Best Buy|eBay(?:\.com)?)\s*[:|｜\-–—]\s*/i, "")
        .replace(/\s*[:|｜]\s*(Amazon|Amazon\.com|Walmart|Walmart\.com|Target|Best Buy|eBay|eBay\.com)\s*$/i, "")
        .replace(/\s*[:|｜]\s*(Home\s*&\s*Kitchen|Electronics|Clothing,\s*Shoes\s*&\s*Jewelry|Musical Instruments|Amazon Luxury|Sports\s*&\s*Outdoors|Tools\s*&\s*Home Improvement|Office Products|Beauty\s*&\s*Personal Care|Health\s*&\s*Household|Toys\s*&\s*Games|Patio,\s*Lawn\s*&\s*Garden|Automotive)\s*$/i, "")
        .replace(/\s+/g, " ")
        .trim();

      return title || "Shared find";
    }

    function smartTruncate(value = "", maxLength = 96) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      const slice = text.slice(0, Math.max(0, maxLength - 1));
      const lastSpace = slice.lastIndexOf(" ");
      const trimmed = lastSpace > 40 ? slice.slice(0, lastSpace) : slice;
      return trimmed.replace(/[\s,;:.-]+$/g, "") + "…";
    }

    function firstNameOrDisplay(value = "") {
      const cleaned = String(value || "").trim().replace(/^@+/, "");
      if (!cleaned) return "";
      return cleaned.split(/\s+/)[0].slice(0, 40);
    }

    function buildShareMessage({ title, note, shareUrl, handleDisplay = "" }) {
      const cleanTitle = smartTruncate(cleanProductTitle(title), 90);
      const cleanNote = smartTruncate(String(note || "").trim(), 140);
      const cleanShareUrl = String(shareUrl || "").trim().replace(/\/+$/g, "");
      const signature = firstNameOrDisplay(handleDisplay);
      return [
        signature ? `${signature} shared via Shuffle:` : "Shared via Shuffle:",
        cleanNote ? `“${cleanNote}”` : "",
        cleanTitle || "",
        cleanShareUrl || ""
      ].filter(Boolean).join("
").replace(/
{3,}/g, "

").trim();
    }


    function withTimeout(promise, ms = 9000, label = "request") {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(`${label} timed out`)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    async function loadShelfDocs() {
      const docs = [];
      const seen = new Set();

      const matchesShelf = (item) => {
        const itemShelf = String(item.shelfSlug || "").toLowerCase();
        const itemHandle = String(item.handleSlug || "").toLowerCase();
        if (slug && itemShelf !== slug) return false;

        // Chrome-review extension shares may not have handleSlug at all.
        // If a handle was requested, prefer matching handle docs but still allow
        // no-user legacy docs for the same shelf slug so old shelves keep working.
        if (handleSlug && itemHandle && itemHandle !== handleSlug) return false;
        return true;
      };

      const addDoc = (docSnap) => {
        if (!docSnap || seen.has(docSnap.id)) return;
        const item = { id: docSnap.id, ...docSnap.data() };
        if (!matchesShelf(item)) return;
        seen.add(docSnap.id);
        docs.push(item);
      };

      const addSnap = (snap) => snap.forEach(addDoc);
      const queryPlans = [];

      // The Chrome-review extension creates no-user shelves with only shelfSlug.
      // Query shelfSlug first because it covers both no-user and handled shelves.
      if (slug) queryPlans.push(query(collection(db, "shares"), where("shelfSlug", "==", slug)));
      if (handleSlug) queryPlans.push(query(collection(db, "shares"), where("handleSlug", "==", handleSlug)));

      for (const q of queryPlans) {
        try {
          addSnap(await withTimeout(getDocs(q), 7000, "Shelf lookup"));
        } catch (error) {
          console.warn("Shelf query failed; trying next plan", error);
        }
      }

      // Final early-launch fallback: public read is allowed and the extension review
      // collection is still small. This prevents a frozen/empty shelf from a query
      // issue while Chrome is reviewing the extension.
      if (!docs.length) {
        try {
          const snap = await withTimeout(getDocs(collection(db, "shares")), 9000, "Shelf fallback lookup");
          addSnap(snap);
        } catch (error) {
          console.warn("Shelf fallback failed", error);
          throw error;
        }
      }

      return docs;
    }

    async function loadShelf() {
      const title = document.getElementById("shelfTitle");
      const status = document.getElementById("status");
      const items = document.getElementById("items");

      if (!slug && !handleSlug) {
        title.textContent = "Missing shelf";
        status.textContent = "No shelf or @username found.";
        return;
      }

      let shelfName = slug ? titleFromSlug(slug) : `@${handleSlug}`;
      let handleDisplay = handleSlug ? handleSlug : "";

      status.innerHTML = `<i class="fa-solid fa-box-open"></i> Loading items…`;
      const docs = await loadShelfDocs();

      docs.sort((a, b) => {
        const aDate = a.created?.toDate ? a.created.toDate() : new Date(a.created || 0);
        const bDate = b.created?.toDate ? b.created.toDate() : new Date(b.created || 0);
        return bDate - aDate;
      });

      if (docs.length) {
        const firstWithShelf = docs.find(item => String(item.shelfName || "").trim());
        const firstWithRealHandle = docs.find(item => String(item.handleSlug || "").trim());
        const firstWithHandleDisplay = docs.find(item => String(item.handleDisplay || item.handleSlug || "").trim());
        if (firstWithShelf?.shelfName && slug) shelfName = String(firstWithShelf.shelfName).trim();
        if (firstWithHandleDisplay) handleDisplay = String(firstWithHandleDisplay.handleDisplay || firstWithHandleDisplay.handleSlug || handleDisplay).trim();
        if (!resolvedHandleSlug && firstWithRealHandle?.handleSlug) resolvedHandleSlug = String(firstWithRealHandle.handleSlug).toLowerCase();
      }

      resolvedShelfUrl = buildResolvedShelfUrl();
      const copyShelf = document.getElementById("copyShelf");
      if (copyShelf) {
        copyShelf.title = resolvedShelfUrl.includes("shelfmix.com")
          ? `Copy ${resolvedShelfUrl}`
          : "Copy Chrome-review-safe legacy shelf link";
      }

      title.textContent = (resolvedHandleSlug || handleSlug) && slug ? `${shelfName} by ${handleDisplay || resolvedHandleSlug || handleSlug}` : (handleDisplay || shelfName);
      document.title = `${title.textContent} — ShareShuffle`;

      items.innerHTML = "";
      status.innerHTML = `
  <i class="fa-solid fa-box-open"></i>
  ${docs.length} item${docs.length === 1 ? "" : "s"}
`;

      if (!docs.length) {
        items.innerHTML = `
          <div class="col-12">
            <div class="hero-card p-4 text-center">
              <h2 class="fw-bold">No items yet</h2>
              <p class="text-secondary mb-0">Save something to this shelf from the ShareShuffle app or extension.</p>
            </div>
          </div>
        `;
        return;
      }

      docs.forEach(item => {
        const shareUrl = `${SHARE_BASE_URL}${String(item.id).toLowerCase()}`;
        const displayTitle = smartTruncate(cleanProductTitle(item.title || "Shared find"), 96);
        const displayNote = smartTruncate(item.note || "I saw this and thought of you.", 120);
        const outboundMessage = buildShareMessage({ title: displayTitle, note: displayNote, shareUrl, handleDisplay: item.handleDisplay || "" });
        const shareText = encodeURIComponent(outboundMessage);
        const emailSubject = encodeURIComponent(displayTitle);
        const emailBody = encodeURIComponent(outboundMessage);
        const image = item.id ? `/i-${String(item.id).toLowerCase()}` : (item.cachedImageUrl || item.cachedImage || item.image || item.imageUrl || "");


const merchant = (item.merchant || "").toLowerCase();

const storeName =
  merchant === "walmart" ? "Walmart" :
  merchant === "target" ? "Target" :
  merchant === "bestbuy" ? "Best Buy" :
  merchant === "ebay" ? "eBay" :
  "Amazon";

const storeIcon =
  merchant === "amazon"
    ? '<i class="fa-brands fa-amazon me-1"></i>'
    : '<i class="fa-solid fa-cart-shopping me-1"></i>';


const storeUrl = item.url || "#";


        const card = document.createElement("div");
        card.className = "col-md-6 col-xl-4";
        card.innerHTML = `
          <article class="card product-card product-card-clickable" data-share-url="${escapeHtml(shareUrl)}">
            <div class="product-img-wrap">
              ${image
                ? `<img class="product-img" src="${escapeHtml(image)}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;missing-image-state&quot;>Image not added yet<small>Tap to open the recommendation</small></div>'">`
                : `<div class="missing-image-state">Image not added yet<small>Tap to open the recommendation</small></div>`
              }
            </div>
            <div class="card-body p-4 d-flex flex-column">
              <h2 class="product-title product-note fw-bold mb-2 clamp-3">
  ${escapeHtml(displayTitle)}
</h2>
              <p class="small-muted mb-3 clamp-2 product-note">${escapeHtml(displayNote)}</p>
              <div class="d-grid gap-2 mt-auto">
  <a
    class="btn btn-ss"
    href="${escapeHtml(storeUrl)}"
    target="_blank"
    rel="noopener noreferrer"
  >
    ${storeIcon} View on ${storeName}
  </a>

  <a
    class="btn btn-outline-secondary share-link-btn"
    href="${escapeHtml(shareUrl)}"
    target="_blank"
    rel="noopener noreferrer"
  >
    <i class="fa-solid fa-share-nodes me-1"></i>
    Open Share Page
  </a>
</div>
               



                <div class="share-actions mt-3">
  <button
    class="share-action-btn copy-share-btn"
    type="button"
    data-url="${escapeHtml(shareUrl)}"
    title="Copy link"
  >
    <i class="fa-solid fa-link"></i>
  </button>

  <a
    class="share-action-btn"
    href="sms:?&body=${shareText}"
    title="Message"
  >
    <i class="fa-solid fa-comment-sms"></i>
  </a>

  <a
    class="share-action-btn"
    href="https://voice.google.com/u/0/messages?item=${encodeURIComponent(shareUrl)}"
    target="_blank"
    rel="noopener noreferrer"
    title="Google Voice"
  >
    <i class="fa-brands fa-google"></i>
  </a>

  <a
    class="share-action-btn"
    href="mailto:?subject=${emailSubject}&body=${emailBody}"
    title="Email"
  >
    <i class="fa-solid fa-envelope"></i>
  </a>
</div>
<p class="affiliate-disclosure">Some product links may be affiliate links. As an Amazon Associate I earn from qualifying purchases.</p>
            </div>
          </article>
        `;

        items.appendChild(card);
      });
    }

    document.getElementById("copyShelf").addEventListener("click", async () => {
      const cleanShelfUrl = resolvedShelfUrl || buildResolvedShelfUrl();
      await navigator.clipboard.writeText(cleanShelfUrl);
      const btn = document.getElementById("copyShelf");
      btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Copied';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-link me-1"></i> Copy Shelf';
      }, 1600);
    });

    loadShelf().catch(error => {
      console.error(error);
      setShelfFailure("Could not load shelf.", error);
    });

    document.addEventListener("click", async (event) => {
  const card = event.target.closest(".product-card.product-card-clickable");
  if (card && !event.target.closest("a, button, .share-actions")) {
    const shareUrl = card.dataset.shareUrl;
    if (shareUrl) {
      window.location.href = shareUrl;
      return;
    }
  }

  const btn = event.target.closest(".copy-share-btn");
  if (!btn) return;

  await navigator.clipboard.writeText(btn.dataset.url);

  const oldHtml = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-check"></i>';

  setTimeout(() => {
    btn.innerHTML = oldHtml;
  }, 1300);
});
  </script>
</body>
