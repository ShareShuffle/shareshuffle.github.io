<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Opening ShareShuffle…</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6ff;color:#172033;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
    .card{background:white;border:1px solid rgba(15,23,42,.1);border-radius:24px;box-shadow:0 20px 50px rgba(15,23,42,.12);padding:28px;max-width:520px}
    .muted{color:#64748b}
    a{color:#2563eb;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Opening ShareShuffle…</h1>
    <p id="status" class="muted">Normalizing this link.</p>
  </main>
  <script type="module">
    import { normalizeRoutePath, routeToDestination } from "/assets/share-core.js";

    const status = document.getElementById("status");

    function go(destination) {
      if (!destination) {
        status.innerHTML = `That ShareShuffle link did not match a share, shelf, or @username route.<br><br><a href="/app/">Create a share</a>`;
        return;
      }
      if (destination.replace) {
        window.location.replace(destination.href);
      } else {
        window.location.href = destination.href;
      }
    }

    const normalized = normalizeRoutePath(location.pathname);
    const destination = routeToDestination({
      hostname: location.hostname,
      pathname: normalized,
      search: location.search
    });

    if (normalized !== location.pathname && destination?.canonicalPath) {
      history.replaceState(null, "", destination.canonicalPath + location.search + location.hash);
    }

    go(destination);
  </script>
</body>
</html>
