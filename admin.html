</head><body class="admin-bg"><script>(function(){const PASS="shuffle";if(sessionStorage.getItem("ssAdminOK")==="yes")return;document.documentElement.style.visibility="hidden";window.addEventListener("DOMContentLoaded",()=>{document.documentElement.style.visibility="visible";const lock=document.createElement("div");lock.className="lock-screen";lock.innerHTML='<div class="lock-card"><div class="ss-brand" style="margin-bottom:14px"><span class="ss-logo"><img src="/icons/icon32.png" alt=""></span><span>ShareShuffle Admin</span></div><h2>Admin preview</h2><p style="color:#667085">Light protection for static GitHub Pages. Use Firebase Auth before real launch.</p><input id="ssPass" type="password" placeholder="Password"><button id="ssUnlock">Unlock</button><p id="ssLockStatus" style="color:#b42318;font-weight:800"></p></div>';document.body.appendChild(lock);const tryUnlock=()=>{if(document.getElementById("ssPass").value===PASS){sessionStorage.setItem("ssAdminOK","yes");lock.remove();}else document.getElementById("ssLockStatus").textContent="Nope. Try the project password."};document.getElementById("ssUnlock").addEventListener("click",tryUnlock);document.getElementById("ssPass").addEventListener("keydown",e=>{if(e.key==="Enter")tryUnlock();});});})();</script><div class="admin-shell"><nav class="ss-nav"><div class="ss-nav-inner"><a class="ss-brand" href="/"><span class="ss-logo"><img src="/icons/icon32.png" alt=""></span><span>ShareShuffle</span></a><div class="ss-links"><a href="/control.html">Control</a><a href="/admin.html">Metrics</a><a href="/dashboard.html">Dashboard</a><a href="/sitemap.html">Sitemap</a><a href="/icons.html">Icons</a></div></div></nav><div class="admin-panel"><span class="ss-eyebrow"><i class="fa-solid fa-chart-simple"></i> Metrics</span><h1>ShareShuffle Admin</h1><p id="status">Loading...</p><div class="cards"><div class="metric"><div>Total Shares</div><div class="num" id="totalShares">0</div></div><div class="metric"><div>Total Views</div><div class="num" id="totalViews">0</div></div><div class="metric"><div>Amazon Clicks</div><div class="num" id="totalClicks">0</div></div><div class="metric"><div>CTR</div><div class="num" id="ctr">0%</div></div></div><h2>Top Shares</h2><div class="table-wrap"><table><thead><tr><th>Image</th><th>Title</th><th>Shelf</th><th>Views</th><th>Amazon Clicks</th><th>CTR</th><th>Link</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC-IdAGNybUmS4LPqQX-WrOVtIDPPl8ZzE",authDomain:"shareshuffle-c7f96.firebaseapp.com",projectId:"shareshuffle-c7f96",storageBucket:"shareshuffle-c7f96.firebasestorage.app",messagingSenderId:"507028011652",appId:"1:507028011652:web:97c161c63b7940af0f60d1",measurementId:"G-C8W9TBP705"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const SHARE_BASE_URL="https://shfl.me/";const num=v=>Number(v||0);const pct=(c,v)=>!v?"0%":((c/v)*100).toFixed(1)+"%";function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function cleanTitle(value=""){let title=String(value).trim();title=title.replace(/^(Amazon(?:\.com)?|Walmart(?:\.com)?|Target|Best Buy|eBay)\s*[:\-–]\s*/i,"");title=title.replace(/\s*[:|]\s*(Home\s*&\s*Kitchen|Electronics|Clothing,\s*Shoes\s*&\s*Jewelry|Musical Instruments|Amazon Luxury)\s*$/i,"");return title||"Untitled";}
async function loadAdmin(){const status=document.getElementById("status"),rows=document.getElementById("rows");const q=query(collection(db,"shares"),orderBy("created","desc"),limit(100));const snapshot=await getDocs(q);let tv=0,tc=0;const items=[];snapshot.forEach(d=>{const data=d.data();const views=num(data.views),amazonClicks=num(data.amazonClicks);tv+=views;tc+=amazonClicks;items.push({id:d.id,...data,views,amazonClicks});});items.sort((a,b)=>b.views-a.views||b.amazonClicks-a.amazonClicks);document.getElementById("totalShares").textContent=snapshot.size;document.getElementById("totalViews").textContent=tv;document.getElementById("totalClicks").textContent=tc;document.getElementById("ctr").textContent=pct(tc,tv);rows.innerHTML="";items.forEach(item=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${item.image?`<img class="thumb" src="${esc(item.image)}" alt="">`:""}</td><td><span class="truncate-one" title="${esc(cleanTitle(item.title||""))}">${esc(cleanTitle(item.title||""))}</span></td><td>${esc(item.shelfName||"")}</td><td>${item.views}</td><td>${item.amazonClicks}</td><td>${pct(item.amazonClicks,item.views)}</td><td><a href="${SHARE_BASE_URL+item.id}" target="_blank" rel="noopener">Open</a></td>`;rows.appendChild(tr);});status.textContent=`Showing ${items.length} recent shares.`;}
loadAdmin().catch(error=>{console.error(error);document.getElementById("status").textContent="Error loading admin.";});
