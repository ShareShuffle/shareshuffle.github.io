<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShareShuffle.com | Demo product share simulator</title><meta name="description" content="Try a simple ShareShuffle demo that simulates turning a messy product page into a clean recommendation link."><meta name="robots" content="index,follow"><link rel="icon" type="image/png" sizes="16x16" href="/icons/icon16.png"><link rel="icon" type="image/png" sizes="24x24" href="/icons/icon24.png"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon32.png"><link rel="icon" type="image/png" sizes="64x64" href="/icons/icon64.png"><link rel="icon" type="image/png" sizes="128x128" href="/icons/icon128.png"><link rel="icon" type="image/png" sizes="512x512" href="/icons/icon512.png"><link rel="apple-touch-icon" href="/icons/icon512.png"><meta name="theme-color" content="#071426"><link rel="stylesheet" href="/assets/brand.css"><link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css" rel="stylesheet"></head><body><nav class="ss-nav"><div class="ss-nav-inner"><a class="ss-brand" href="/"><span class="ss-logo"><img src="/icons/icon32.png" alt=""></span><span>ShareShuffle</span></a><div class="ss-links"><a href="/">Home</a><a href="/demo.html">Demo</a><a href="/investor.html">Investor</a><a href="https://shelfmix.com">ShelfMix</a></div></div></nav><section class="ss-hero"><div class="ss-container ss-grid"><div><span class="ss-eyebrow"><i class="fa-solid fa-wand-magic-sparkles"></i> Demo</span><h1 class="ss-title">Turn a product into a share.</h1><p class="ss-subtitle">This front-end demo shows the customer flow without needing the extension.</p></div><div class="ss-card"><label>Product title</label><input id="demoTitle" value="Amazon.com | Yamaha BB735A 5-String Bass Guitar" style="width:100%;padding:12px;border-radius:14px;border:1px solid #d8e2f0"><label>Note</label><textarea id="demoNote" style="width:100%;min-height:90px;padding:12px;border-radius:14px;border:1px solid #d8e2f0">This is the bass I’d recommend first.</textarea><label>Short link</label><input id="demoUrl" value="https://shfl.me/bass" style="width:100%;padding:12px;border-radius:14px;border:1px solid #d8e2f0"><button class="ss-btn" id="makeDemo" style="margin-top:14px"><i class="fa-solid fa-shuffle"></i> Build message</button><pre id="demoOut" style="white-space:pre-wrap;background:#071426;color:white;padding:16px;border-radius:18px;margin-top:14px"></pre></div></div></section><script>
function neutralizeText(value=""){return value.normalize("NFKC").replace(/\./g,"․").replace(/:/g,"꞉").replace(/\//g,"⁄").replace(/&/g,"＆").replace(/@/g,"＠").replace(/\?/g,"？").replace(/=/g,"＝").replace(/#/g,"＃").replace(/%/g,"％").replace(/\+/g,"＋").replace(/</g,"‹").replace(/>/g,"›").replace(/`/g,"＇").replace(/\[/g,"［").replace(/\]/g,"］").replace(/\{/g,"｛").replace(/\}/g,"｝");}
function cleanTitle(t){return neutralizeText(t).replace(/^Amazon․com\s*\|\s*/i,"").trim();}
function build(){const t=cleanTitle(demoTitle.value).slice(0,90);const n=neutralizeText(demoNote.value).trim().slice(0,140);demoOut.textContent=["🎯 Shared via Shuffle",n?`📝 ${n}`:"",t,`🖇️ ${demoUrl.value.replace(/^https?:\/\//,"")}`].filter(Boolean).join("
");}
makeDemo.addEventListener('click',build);build();</script></body></html>
